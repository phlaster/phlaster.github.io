#========== ABOUT ==========#
[about]
name = { en = "Alexander Bezlepsky", fr = "Alexander Bezlepski", ru = "Александр Безлепский" }
tagline = { en = "Bioinformatics graduate with a background in applied mathematics and physics; I develop open-source tools for genomic analytics and combine this with wet-lab work.", fr = "Diplômé en bioinformatique avec une formation en mathématiques appliquées et en physique; je développe des outils open-source pour l'analytique génomique, en combinant cela avec un travail à la paillasse.", ru = "Бакалавр биоинформатики с подготовкой в прикладной математике и физике; разрабатываю open-source инструменты для геномной аналитики и совмещаю это с работой в мокрой лаборатории." }
bio = { en = """
Hi, my name is Alex. I like going through the whole research
cycle: collecting a sample in the field, extracting DNA, running PCR,
setting up electrophoresis, and then processing the data and assembling
the statistics into a beautiful interactive dashboard. The intersection
of the wet lab and high-performance computing is where I feel at home.

I graduated from Peter the Great St. Petersburg Polytechnic University
with a degree in Applied Mathematics and Informatics (bioinformatics),
and I'm now looking for a master's programme — the next step toward
a scientific career. Alongside that, I work in the Laboratory of
Microbiological Monitoring at ARRIAM (Pushkin, Saint Petersburg):
I study soil metagenomes and handle DNA extraction, electrophoresis,
PCR, and sequencing library preparation.

I write in Julia, Python, and R; I develop open-source packages for
genomic analytics and contribute to collaborative pangenomics projects.
I have co-authorship experience in peer-reviewed journals and have
given talks at field conferences.

Right now I'm deliberately deepening my biological foundation,
sharpening my statistics, and learning French. From a master's
programme I expect a transition from applied tasks to fundamental
questions in evolutionary genomics and metagenomics — from soil
communities to the human microbiome.

Outside of science I translate poetry, ride a bike, and build small
web tools — sometimes useful, sometimes just pretty.
""", fr = """
Salut, je m'appelle Alex. J'aime parcourir le cycle de recherche
en entier : prélever un échantillon sur le terrain, extraire l'ADN,
lancer une PCR, monter une électrophorèse, puis traiter les données
et assembler les statistiques en un beau tableau de bord interactif.
C'est à l'intersection de la paillasse et du calcul haute performance
que je me sens à ma place.

J'ai obtenu mon diplôme de l'Université polytechnique de
Saint-Pétersbourg en mathématiques appliquées et informatique
(bioinformatique), et je cherche maintenant un master — la prochaine
étape vers une carrière scientifique. En parallèle, je travaille au
laboratoire de surveillance microbiologique de l'ARRIAM (Pouchkine,
Saint-Pétersbourg) : j'étudie les métagénomes du sol et je m'occupe
d'extraction d'ADN, d'électrophorèse, de PCR et de préparation de
banques pour le séquençage.

I write in Julia, Python, and R; I develop open-source packages for
genomic analytics and contribute to collaborative pangenomics projects.
I have co-authorship experience in peer-reviewed journals and have
given talks at field conferences.

En ce moment, j'approfondis délibérément mes bases en biologie,
je renforce mes statistiques et j'apprends le français. J'attends d'un
master la transition des tâches appliquées vers des questions
fondamentales en génomique évolutive et en métagénomique — des
communautés du sol au microbiome humain.

En dehors de la science, je traduis de la poésie, je fais du vélo et
je construis de petits outils web — parfois utiles, parfois simplement
jolis.
""", ru = """
Привет, меня зовут Саша. Мне нравится проходить исследовательский
цикл целиком: отобрать пробу в поле, выделить ДНК, прогнать ПЦР,
поставить форез, а потом обработать данные и собрать статистику
в красивый интерактивный дашборд. На стыке мокрой лаборатории
и высокопроизводительных вычислений я чувствую себя на своём месте.

Я закончил Политех по направлению «Прикладная математика и
информатика» (биоинформатика) и сейчас ищу магистратуру —
следующий шаг к научной карьере. Параллельно работаю
в лаборатории микробиологического мониторинга ВНИИСХМ (г. Пушкин,
Санкт-Петербург): исследую почвенные метагеномы, занимаюсь
выделением ДНК, электрофорезом, ПЦР и подготовкой библиотек
к секвенированию.

Пишу на Julia, Python и R; развиваю open-source пакеты для геномной
аналитики, участвую в совместных проектах по пангеномике. Есть опыт
соавторства в рецензируемых журналах и докладов на профильных конференциях.

Сейчас целенаправленно углубляю биологическую базу, подтягиваю
статистику и учу французский. От магистратуры жду перехода
от прикладных задач к фундаментальным вопросам в эволюционной
геномике и метагеномике — от почвенных сообществ до микробиома
человека.

Вне науки перевожу стихи, катаюсь на велосипеде и собираю
небольшие веб-инструменты — иногда полезные, иногда просто
красивые.
""" }
